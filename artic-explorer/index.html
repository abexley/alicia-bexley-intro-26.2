<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTIC Explorer</title>

  <!-- CSS -->
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- Header -->
  <header class="hero">
    <nav>
      <a href="../index.html">← Back to Portfolio</a>
      <h1>ARTIC Explorer</h1>
    </nav>
    <p class="subtitle">Discover artworks and artists from the Art Institute of Chicago</p>
  </header>

  <!-- Controls -->
  <section class="controls">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search artworks or artists..."
    >
    <button id="artworksBtn">Show Artworks</button>
    <button id="artistsBtn">Show Artists</button>
  </section>

  <section class="pagination">
  <button id="prevPage">Previous</button>
  <button id="nextPage">Next</button>
</section>

  <!-- Section Title -->
  <h2 class="section-title">Results</h2>

  <!-- Results Grid -->
  <section id="results"></section>

  <!-- Footer -->
  <footer>
    <p>ARTIC Explorer Open API• Built by Alicia Bexley </p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
